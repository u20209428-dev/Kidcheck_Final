<!--LOGIN SE CONECTA A ESCANER SI ERES DE SEGURIDAD-->
<!--LOGIN SE CONECTA A PERSONAL SI ERES PROFESOR-->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | KidCheck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- LOGOTIPO -->
            <div class="brand-icon">
                <i class="bi bi-shield-check"></i>
            </div>

            <h1>KidCheck</h1>

            <p class="brand-description">
                Control de asistencia escolar
            </p>

            <!-- BIENVENIDA -->
            <div class="welcome-text">
                <h2>¡Bienvenido!</h2>
                <p>Ingresa tus credenciales para continuar.</p>
            </div>

            <!--
                FUTURO SPRING SECURITY:
                El servidor validará las credenciales.
                El rol se obtendrá de la cuenta autenticada,
                no de un valor elegido por el usuario.
            -->
            <form action="/login" method="post">

                <!-- USUARIO -->
                <div class="form-group">
                    <label for="username" class="form-label">
                        Usuario o correo electrónico
                    </label>

                    <div class="input-wrapper">
                        <i class="bi bi-person"></i>

                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Ingresa tu usuario" autocomplete="username" required>
                    </div>
                </div>

                <!-- CONTRASEÑA -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        Contraseña
                    </label>

                    <div class="input-wrapper">
                        <i class="bi bi-lock"></i>

                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                    </div>
                </div>

                <!-- OPCIONES -->
                <div class="login-options">

                    <label class="remember-option">
                        <input type="checkbox" name="remember-me" value="true">

                        <span>Recordarme</span>
                    </label>

                    <!--
                        FUTURO:
                        Enlazar a la página de recuperación
                        de contraseña cuando se implemente.
                    -->
                    <a href="#" class="forgot-link">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <!-- BOTÓN -->
                <button type="submit" class="login-button">
                    Iniciar sesión
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <!-- SEGURIDAD -->
            <div class="security-note">
                <i class="bi bi-shield-lock"></i>

                <span>
                    Acceso al sistema de asistencia escolar
                </span>
            </div>

        </section>

        <footer class="login-footer">
            KidCheck · Control de asistencia escolar
        </footer>

    </main>

</body>

</html>
